<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Geofencing API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        input, select { margin: 5px; padding: 5px; }
        button { margin: 5px; padding: 5px 10px; }
        table { border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 5px 10px; }
        th { background: #eee; }
    </style>
</head>
<body>
    <h1>Geofencing API Test</h1>

    <h2>Crear Zona</h2>
    <input type="text" id="zone_name" placeholder="Nombre Zona">
    <input type="number" id="center_latitude" placeholder="Latitud">
    <input type="number" id="center_longitude" placeholder="Longitud">
    <input type="number" id="radius_meters" placeholder="Radio (m)">
    <input type="number" id="max_speed_allowed" placeholder="Velocidad Máx">
    <select id="type">
        <option value="school">School</option>
        <option value="hospital">Hospital</option>
        <option value="historic_center">Historic Center</option>
        <option value="residential_area">Residential Area</option>
    </select>
    <button onclick="createZone()">Crear Zona</button>

    <h2>Zonas Activas</h2>
    <button onclick="getZones()">Actualizar Lista</button>
    <br>
    <input type="number" id="get_id" placeholder="ID para buscar">
    <button onclick="getZoneById()">Buscar por ID</button>
    <br>
    <input type="number" id="update_id" placeholder="ID para actualizar">
    <input type="text" id="update_name" placeholder="Nuevo nombre">
    <button onclick="updateZone()">Actualizar Nombre</button>
    <br>
    <input type="text" id="delete_ids" placeholder="IDs para eliminar (ej: 1,2,3)">
    <button onclick="deleteSelection()">Eliminar Selección</button>
    <table id="zonesTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Latitud</th>
                <th>Longitud</th>
                <th>Radio</th>
                <th>Velocidad Máx</th>
                <th>Tipo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

<script>
const apiUrl = '/controllers/geofencingController.php'; // Ajusta según tu ruta

// Obtener todas las zonas
function getZones() {
    fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
            const tbody = document.querySelector('#zonesTable tbody');
            tbody.innerHTML = '';
            if (data.success && data.data.length) {
                data.data.forEach(zone => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${zone.zone_id}</td>
                        <td>${zone.zone_name}</td>
                        <td>${zone.center_latitude}</td>
                        <td>${zone.center_longitude}</td>
                        <td>${zone.radius_meters}</td>
                        <td>${zone.max_speed_allowed}</td>
                        <td>${zone.type}</td>
                        <td>
                            <button onclick="deleteZone(${zone.zone_id})">Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        });
}

// Crear zona
function createZone() {
    const data = {
        zone_name: document.getElementById('zone_name').value,
        center_latitude: parseFloat(document.getElementById('center_latitude').value),
        center_longitude: parseFloat(document.getElementById('center_longitude').value),
        radius_meters: parseInt(document.getElementById('radius_meters').value),
        max_speed_allowed: parseInt(document.getElementById('max_speed_allowed').value),
        type: document.getElementById('type').value
    };

    fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(res => {
        alert(res.message);
        getZones();
    });
}

// Eliminar zona (soft delete)
function deleteZone(id) {
    if (!confirm('¿Seguro que deseas eliminar esta zona?')) return;
    fetch(`${apiUrl}?id=${id}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(res => {
            alert(res.message);
            getZones();
        });
}

// Buscar zona por ID
function getZoneById() {
    const id = document.getElementById('get_id').value;
    if (!id) return alert('Introduce un ID');
    fetch(`${apiUrl}?id=${id}`)
        .then(res => res.json())
        .then(res => {
            alert(JSON.stringify(res, null, 2));
        });
}

// Actualizar nombre de zona
function updateZone() {
    const id = document.getElementById('update_id').value;
    const name = document.getElementById('update_name').value;
    if (!id || !name) return alert('Introduce ID y nuevo nombre');
    fetch(`${apiUrl}?id=${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ zone_name: name })
    })
    .then(res => res.json())
    .then(res => {
        alert(res.message);
        getZones();
    });
}

// Eliminar selección de zonas (soft delete)
function deleteSelection() {
    const ids = document.getElementById('delete_ids').value;
    if (!ids) return alert('Introduce IDs separados por coma');
    const idArray = ids.split(',').map(x => x.trim()).filter(x => x);
    fetch(`${apiUrl}?ids=${idArray.join(',')}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(res => {
            alert(res.message);
            getZones();
        });
}

// Inicializar tabla al cargar
getZones();
</script>

</body>
</html>
